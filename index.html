<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>025:00 - Bộ đếm giờ Pomodoro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pomo: {
              work: '#ba4949',
              workDark: '#a44242',
              short: '#38858a',
              shortDark: '#32777c',
              long: '#397097',
              longDark: '#336386',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            fredoka: ['Fredoka', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      transition: background-color 0.4s ease, color 0.4s ease;
      font-family: 'Inter', sans-serif;
    }
    
    .bg-work { background-color: #ba4949; }
    .bg-short { background-color: #38858a; }
    .bg-long { background-color: #397097; }

    .btn-press {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-press:active {
      transform: translateY(4px);
      box-shadow: none !important;
    }
  </style>
</head>
<body id="app-body" class="bg-work text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-white/20">

  <!-- Header / Navigation Bar -->
  <header class="w-full max-w-xl flex items-center justify-between py-4 border-b border-black/10">
    <!-- Language Selector Dropdown -->
    <div class="relative">
      <button onclick="toggleLangMenu()" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition backdrop-blur-sm">
        <i class="fa-solid fa-globe text-xs"></i>
        <span id="current-lang-text">Tiếng Việt</span>
        <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
      </button>
      <div id="lang-menu" class="hidden absolute left-0 mt-2 w-36 bg-white text-gray-800 rounded-xl shadow-xl py-2 z-20 text-sm">
        <button onclick="changeLanguage('vi')" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2 font-medium">🇻🇳 Tiếng Việt</button>
        <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2 font-medium">🇬🇧 English</button>
        <button onclick="changeLanguage('zh')" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2 font-medium">🇨🇳 中文</button>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openSettingsModal()" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition backdrop-blur-sm">
        <i class="fa-solid fa-gear text-xs"></i>
        <span data-i18n="settings">Cài đặt</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-xl my-auto flex flex-col items-center gap-6">

    <!-- Main Timer Card -->
    <div class="w-full bg-white/10 backdrop-blur-md rounded-2xl p-8 sm:p-10 flex flex-col items-center shadow-lg border border-white/10">

      <!-- Real-time Clock Widget (Tăng cỡ chữ to hơn) -->
      <div class="flex items-center gap-2.5 text-white/95 text-base sm:text-lg font-semibold mb-2 bg-black/20 py-2 px-5 rounded-full backdrop-blur-md shadow-inner">
        <i class="fa-regular fa-clock text-lg"></i>
        <span data-i18n="hanoiTime">Giờ Hà Nội (GMT+7):</span>
        <span id="realtime-clock" class="font-mono font-bold text-lg sm:text-xl text-yellow-300">--:--:--</span>
      </div>

      <!-- Timer Display -->
      <div id="timer-display" class="font-fredoka text-7xl sm:text-9xl font-bold tracking-tight my-6 select-none drop-shadow-md">
        25:00
      </div>

      <!-- Action Buttons (Start/Pause & Skip) -->
      <div class="flex items-center gap-4 w-full justify-center mt-2">
        <button id="start-btn" onclick="toggleTimer()" class="btn-press uppercase tracking-wider text-2xl font-bold px-12 py-3.5 rounded-xl bg-white text-pomo-work shadow-[0_6px_0_#ebebeb] hover:bg-white/95 transition-all w-48" data-i18n="start">
          BẮT ĐẦU
        </button>
        <button id="skip-btn" onclick="skipTimer()" class="hidden text-white/70 hover:text-white p-3 text-xl transition" title="Next Mode">
          <i class="fa-solid fa-forward"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-xl text-center text-xs text-white/60 py-4"></footer>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white text-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative transform scale-95 transition-transform duration-200" id="settings-modal-card">
      <div class="flex items-center justify-between border-b pb-3 mb-4">
        <h3 class="font-bold text-lg text-gray-700 uppercase tracking-wider text-xs" data-i18n="timerSettings">Cài đặt bộ đếm giờ</h3>
        <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Time Settings (Minutes) -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-600 mb-2" data-i18n="timeMinutes">Thời gian (phút)</label>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <span class="text-xs text-gray-400 block mb-1" data-i18n="pomodoro">Pomodoro</span>
            <input type="number" id="setting-pomo" min="1" max="120" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-red-400">
          </div>
          <div>
            <span class="text-xs text-gray-400 block mb-1" data-i18n="shortBreak">Nghỉ ngắn</span>
            <input type="number" id="setting-short" min="1" max="60" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-teal-400">
          </div>
          <div>
            <span class="text-xs text-gray-400 block mb-1" data-i18n="longBreak">Nghỉ dài</span>
            <input type="number" id="setting-long" min="1" max="60" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-blue-400">
          </div>
        </div>
      </div>

      <!-- Sound & Auto Options -->
      <div class="flex flex-col gap-4 border-t pt-4">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700" data-i18n="autoBreak">Tự động bắt đầu nghỉ</span>
          <input type="checkbox" id="setting-autobreak" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700" data-i18n="autoPomo">Tự động bắt đầu Pomodoro</span>
          <input type="checkbox" id="setting-autopomo" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700" data-i18n="volume">Âm lượng</span>
          <input type="range" id="setting-volume" min="0" max="100" value="80" class="accent-red-500 cursor-pointer">
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="mt-6 pt-3 border-t flex justify-end">
        <button onclick="saveSettings()" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold px-6 py-2 rounded-xl text-sm transition shadow" data-i18n="confirm">
          Xác nhận
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // --- Multi-language System ---
    const translations = {
      vi: {
        langName: "Tiếng Việt",
        settings: "Cài đặt",
        pomodoro: "Pomodoro",
        shortBreak: "Nghỉ ngắn",
        longBreak: "Nghỉ dài",
        start: "BẮT ĐẦU",
        pause: "TẠM DỪNG",
        hanoiTime: "Giờ Hà Nội (GMT+7):",
        timerSettings: "Cài đặt bộ đếm giờ",
        timeMinutes: "Thời gian (phút)",
        autoBreak: "Tự động bắt đầu nghỉ",
        autoPomo: "Tự động bắt đầu Pomodoro",
        volume: "Âm lượng",
        confirm: "Xác nhận",
        titleFocus: "Thời gian tập trung!"
      },
      en: {
        langName: "English",
        settings: "Settings",
        pomodoro: "Pomodoro",
        shortBreak: "Short Break",
        longBreak: "Long Break",
        start: "START",
        pause: "PAUSE",
        hanoiTime: "Hanoi Time (GMT+7):",
        timerSettings: "Timer Settings",
        timeMinutes: "Time (minutes)",
        autoBreak: "Auto-start Breaks",
        autoPomo: "Auto-start Pomodoros",
        volume: "Sound Volume",
        confirm: "OK",
        titleFocus: "Time to focus!"
      },
      zh: {
        langName: "中文",
        settings: "设置",
        pomodoro: "专注",
        shortBreak: "短休",
        longBreak: "长休",
        start: "开始",
        pause: "暂停",
        hanoiTime: "河内时间 (GMT+7):",
        timerSettings: "计时器设置",
        timeMinutes: "时间（分钟）",
        autoBreak: "自动开始休息",
        autoPomo: "自动开始专注",
        volume: "音量",
        confirm: "确定",
        titleFocus: "是时候专注了！"
      }
    };

    let currentLang = 'vi';

    function toggleLangMenu() {
      const menu = document.getElementById('lang-menu');
      menu.classList.toggle('hidden');
    }

    function changeLanguage(lang) {
      currentLang = lang;
      document.getElementById('current-lang-text').textContent = translations[lang].langName;
      document.getElementById('lang-menu').classList.add('hidden');
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      const startBtn = document.getElementById('start-btn');
      startBtn.textContent = isRunning ? translations[lang].pause : translations[lang].start;

      updateDisplay();
    }

    document.addEventListener('click', (e) => {
      const langMenu = document.getElementById('lang-menu');
      if (!e.target.closest('#lang-menu') && !e.target.closest('button[onclick="toggleLangMenu()"]')) {
        langMenu.classList.add('hidden');
      }
    });

    // --- Real-time Clock (Hanoi Time UTC+7) ---
    function updateHanoiClock() {
      const now = new Date();
      const options = {
        timeZone: 'Asia/Bangkok',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const timeString = new Intl.DateTimeFormat('vi-VN', options).format(now);
      document.getElementById('realtime-clock').textContent = timeString;
    }

    setInterval(updateHanoiClock, 1000);
    updateHanoiClock();

    // --- Application State ---
    let config = {
      pomodoro: 25,
      shortBreak: 5,
      longBreak: 15,
      autoStartBreaks: false,
      autoStartPomodoros: false,
      volume: 80
    };

    let currentMode = 'pomodoro';
    let timeLeft = config.pomodoro * 60;
    let timerInterval = null;
    let isRunning = false;

    const modeThemes = {
      pomodoro: {
        bgClass: 'bg-work',
        btnTextHex: '#ba4949',
        shadowColor: '#ebebeb',
        titleKey: 'titleFocus'
      }
    };

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClickSound() {
      try {
        initAudio();
        if (config.volume === 0) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);

        const vol = (config.volume / 100) * 0.15;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function playAlarmSound() {
      try {
        initAudio();
        if (config.volume === 0) return;

        const now = audioCtx.currentTime;
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime((config.volume / 100) * 0.3, now);
        masterGain.connect(audioCtx.destination);

        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + index * 0.15);

          noteGain.gain.setValueAtTime(0, now + index * 0.15);
          noteGain.gain.linearRampToValueAtTime(1, now + index * 0.15 + 0.03);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.5);

          osc.connect(noteGain);
          noteGain.connect(masterGain);

          osc.start(now + index * 0.15);
          osc.stop(now + index * 0.15 + 0.5);
        });
      } catch (e) {}
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      document.getElementById('timer-display').textContent = formatted;
      const titleSuffix = translations[currentLang][modeThemes[currentMode].titleKey];
      document.title = `${formatted} - ${titleSuffix}`;
    }

    function toggleTimer() {
      playClickSound();
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      initAudio();
      isRunning = true;
      const startBtn = document.getElementById('start-btn');
      startBtn.textContent = translations[currentLang].pause;
      startBtn.style.boxShadow = 'none';
      startBtn.style.transform = 'translateY(4px)';

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          timerComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      const startBtn = document.getElementById('start-btn');
      startBtn.textContent = translations[currentLang].start;
      startBtn.style.boxShadow = `0 6px 0 ${modeThemes[currentMode].shadowColor}`;
      startBtn.style.transform = 'translateY(0px)';
    }

    function timerComplete() {
      pauseTimer();
      playAlarmSound();
    }

    function openSettingsModal() {
      playClickSound();
      document.getElementById('setting-pomo').value = config.pomodoro;
      document.getElementById('setting-short').value = config.shortBreak;
      document.getElementById('setting-long').value = config.longBreak;
      document.getElementById('setting-autobreak').checked = config.autoStartBreaks;
      document.getElementById('setting-autopomo').checked = config.autoStartPomodoros;
      document.getElementById('setting-volume').value = config.volume;

      const modal = document.getElementById('settings-modal');
      const modalCard = document.getElementById('settings-modal-card');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
      }, 10);
    }

    function closeSettingsModal() {
      playClickSound();
      const modal = document.getElementById('settings-modal');
      const modalCard = document.getElementById('settings-modal-card');
      modal.classList.add('opacity-0');
      modalCard.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    function saveSettings() {
      config.pomodoro = parseInt(document.getElementById('setting-pomo').value) || 25;
      config.shortBreak = parseInt(document.getElementById('setting-short').value) || 5;
      config.longBreak = parseInt(document.getElementById('setting-long').value) || 15;
      config.autoStartBreaks = document.getElementById('setting-autobreak').checked;
      config.autoStartPomodoros = document.getElementById('setting-autopomo').checked;
      config.volume = parseInt(document.getElementById('setting-volume').value);

      localStorage.setItem('pomo_config', JSON.stringify(config));
      closeSettingsModal();

      if (!isRunning) {
        timeLeft = config[currentMode] * 60;
        updateDisplay();
      }
    }

    function loadLocalStorage() {
      const savedConfig = localStorage.getItem('pomo_config');
      if (savedConfig) {
        try { config = { ...config, ...JSON.parse(savedConfig) }; } catch (e) {}
      }
    }

    window.onload = function () {
      loadLocalStorage();
      updateDisplay();
    };
  </script>
</body>
</html>
