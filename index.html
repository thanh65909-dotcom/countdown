<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>025:00 - Thời gian tập trung!</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pomo: {
              work: '#ba4949',
              workDark: '#a44242',
              short: '#38858a',
              shortDark: '#32777c',
              long: '#397097',
              longDark: '#336386',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            fredoka: ['Fredoka', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      transition: background-color 0.4s ease, color 0.4s ease;
      font-family: 'Inter', sans-serif;
    }
    
    .bg-work { background-color: #ba4949; }
    .bg-short { background-color: #38858a; }
    .bg-long { background-color: #397097; }

    .btn-press {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-press:active {
      transform: translateY(4px);
      box-shadow: none !important;
    }

    /* Custom Scrollbar for Tasks */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }
  </style>
</head>
<body id="app-body" class="bg-work text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-white/20">

  <!-- Header / Navigation Bar -->
  <header class="w-full max-w-xl flex items-center justify-between py-4 border-b border-black/10">
    <div class="flex items-center gap-2 cursor-pointer" onclick="resetApp()">
      <i class="fa-solid font-bold fa-circle-check text-2xl text-white/90"></i>
      <span class="font-fredoka text-xl tracking-wide font-semibold">Pomofocus</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openSettingsModal()" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition backdrop-blur-sm">
        <i class="fa-solid fa-gear text-xs"></i>
        <span>Cài đặt</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-xl my-6 flex flex-col items-center gap-6">

    <!-- Mode Selector Tabs & Main Timer Card -->
    <div class="w-full bg-white/10 backdrop-blur-md rounded-2xl p-6 md:p-8 flex flex-col items-center shadow-lg border border-white/10">
      
      <!-- Modes Header -->
      <div class="flex gap-2 mb-6 bg-black/10 p-1.5 rounded-xl w-full justify-around text-sm font-medium">
        <button id="tab-pomodoro" onclick="switchMode('pomodoro')" class="flex-1 py-1.5 px-3 rounded-lg transition-all duration-200 font-semibold bg-white/20 shadow-sm">
          Pomodoro
        </button>
        <button id="tab-shortBreak" onclick="switchMode('shortBreak')" class="flex-1 py-1.5 px-3 rounded-lg transition-all duration-200 opacity-80 hover:opacity-100">
          Nghỉ ngắn
        </button>
        <button id="tab-longBreak" onclick="switchMode('longBreak')" class="flex-1 py-1.5 px-3 rounded-lg transition-all duration-200 opacity-80 hover:opacity-100">
          Nghỉ dài
        </button>
      </div>

      <!-- Timer Display -->
      <div id="timer-display" class="font-fredoka text-7xl sm:text-9xl font-bold tracking-tight my-4 select-none drop-shadow-md">
        25:00
      </div>

      <!-- Active Task Label Indicator inside timer -->
      <div id="current-task-display" class="text-white/80 text-sm font-medium mb-6 min-h-[1.25rem] text-center max-w-xs truncate">
        #1 Thời gian tập trung!
      </div>

      <!-- Action Buttons (Start/Pause & Skip) -->
      <div class="flex items-center gap-4 w-full justify-center">
        <button id="start-btn" onclick="toggleTimer()" class="btn-press uppercase tracking-wider text-2xl font-bold px-12 py-3.5 rounded-xl bg-white text-pomo-work shadow-[0_6px_0_#ebebeb] hover:bg-white/95 transition-all w-48">
          BẮT ĐẦU
        </button>
        <button id="skip-btn" onclick="skipTimer()" class="hidden text-white/70 hover:text-white p-3 text-xl transition" title="Chế độ tiếp theo">
          <i class="fa-solid fa-forward"></i>
        </button>
      </div>
    </div>

    <!-- Task Management Section -->
    <div class="w-full flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-white/20 pb-3">
        <h2 class="text-lg font-semibold tracking-wide">Công việc</h2>
        <div class="relative group">
          <button onclick="toggleTaskMenu()" class="bg-white/20 hover:bg-white/30 p-2 rounded-lg text-sm transition">
            <i class="fa-solid fa-ellipsis-vertical px-1"></i>
          </button>
          <!-- Task Menu Dropdown -->
          <div id="task-menu" class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-xl shadow-xl py-2 z-20 text-sm">
            <button onclick="clearCompletedTasks()" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2 text-gray-700">
              <i class="fa-regular fa-trash-can text-xs"></i> Xóa công việc đã hoàn thành
            </button>
            <button onclick="clearAllTasks()" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2 text-red-600">
              <i class="fa-solid fa-trash text-xs"></i> Xóa tất cả công việc
            </button>
          </div>
        </div>
      </div>

      <!-- Task List Container -->
      <div id="task-list" class="flex flex-col gap-2.5 max-h-80 overflow-y-auto pr-1">
        <!-- Tasks dynamically inserted here -->
      </div>

      <!-- Add Task Button / Form -->
      <div id="add-task-container">
        <button id="add-task-btn" onclick="showTaskForm()" class="w-full py-4 border-2 border-dashed border-white/30 hover:border-white/60 bg-black/10 hover:bg-black/20 rounded-xl font-medium flex items-center justify-center gap-2 text-white/90 transition">
          <i class="fa-solid fa-circle-plus"></i> Thêm công việc
        </button>

        <!-- New Task Form (Hidden by default) -->
        <form id="task-form" onsubmit="handleTaskSubmit(event)" class="hidden bg-white text-gray-800 rounded-xl p-4 shadow-xl flex flex-col gap-3">
          <input type="text" id="task-title-input" placeholder="Bạn đang làm việc gì?" required class="w-full px-3 py-2 text-base font-medium text-gray-800 focus:outline-none placeholder-gray-400">
          <div class="flex items-center gap-2 text-sm text-gray-600 px-1">
            <label for="task-est-input" class="font-medium">Số Pomodoro dự kiến:</label>
            <input type="number" id="task-est-input" min="1" max="100" value="1" class="w-16 bg-gray-100 rounded px-2 py-1 text-center font-bold text-gray-800 border border-gray-300">
          </div>
          <div class="flex justify-end gap-2 bg-gray-50 -mx-4 -mb-4 p-3 rounded-b-xl border-t border-gray-100">
            <button type="button" onclick="hideTaskForm()" class="px-4 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-200 transition">
              Hủy
            </button>
            <button type="submit" class="px-5 py-1.5 rounded-lg text-sm font-semibold bg-gray-800 text-white hover:bg-gray-900 transition shadow">
              Lưu
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-xl text-center text-xs text-white/60 py-6">
    <p>Lấy cảm hứng từ Pomofocus.io • Xây dựng bằng HTML, Tailwind & Vanilla JS</p>
  </footer>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white text-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative transform scale-95 transition-transform duration-200" id="settings-modal-card">
      <div class="flex items-center justify-between border-b pb-3 mb-4">
        <h3 class="font-bold text-lg text-gray-700 uppercase tracking-wider text-xs">Cài đặt bộ đếm giờ</h3>
        <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Time Settings (Minutes) -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-600 mb-2">Thời gian (phút)</label>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <span class="text-xs text-gray-400 block mb-1">Pomodoro</span>
            <input type="number" id="setting-pomo" min="1" max="120" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-red-400">
          </div>
          <div>
            <span class="text-xs text-gray-400 block mb-1">Nghỉ ngắn</span>
            <input type="number" id="setting-short" min="1" max="60" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-teal-400">
          </div>
          <div>
            <span class="text-xs text-gray-400 block mb-1">Nghỉ dài</span>
            <input type="number" id="setting-long" min="1" max="60" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 font-bold text-gray-700 text-center focus:outline-none focus:ring-2 focus:ring-blue-400">
          </div>
        </div>
      </div>

      <!-- Sound & Auto Options -->
      <div class="flex flex-col gap-4 border-t pt-4">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700">Tự động bắt đầu nghỉ</span>
          <input type="checkbox" id="setting-autobreak" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700">Tự động bắt đầu Pomodoro</span>
          <input type="checkbox" id="setting-autopomo" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700">Âm lượng</span>
          <input type="range" id="setting-volume" min="0" max="100" value="80" class="accent-red-500 cursor-pointer">
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="mt-6 pt-3 border-t flex justify-end">
        <button onclick="saveSettings()" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold px-6 py-2 rounded-xl text-sm transition shadow">
          Xác nhận
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // --- Application State ---
    let config = {
      pomodoro: 25,
      shortBreak: 5,
      longBreak: 15,
      autoStartBreaks: false,
      autoStartPomodoros: false,
      volume: 80
    };

    let currentMode = 'pomodoro'; // 'pomodoro' | 'shortBreak' | 'longBreak'
    let timeLeft = config.pomodoro * 60;
    let timerInterval = null;
    let isRunning = false;
    let tasks = [];
    let activeTaskId = null;
    let editingTaskId = null;

    // Theme Configs per Mode
    const modeThemes = {
      pomodoro: {
        bgClass: 'bg-work',
        btnTextHex: '#ba4949',
        shadowColor: '#ebebeb',
        titleSuffix: 'Thời gian tập trung!'
      },
      shortBreak: {
        bgClass: 'bg-short',
        btnTextHex: '#38858a',
        shadowColor: '#ebebeb',
        titleSuffix: 'Đã đến giờ nghỉ ngơi!'
      },
      longBreak: {
        bgClass: 'bg-long',
        btnTextHex: '#397097',
        shadowColor: '#ebebeb',
        titleSuffix: 'Đã đến giờ nghỉ dài!'
      }
    };

    // --- Audio System (Web Audio API Synthesizer) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClickSound() {
      try {
        initAudio();
        if (config.volume === 0) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);

        const vol = (config.volume / 100) * 0.15;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {
        // Audio fallback silent fail
      }
    }

    function playAlarmSound() {
      try {
        initAudio();
        if (config.volume === 0) return;

        const now = audioCtx.currentTime;
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime((config.volume / 100) * 0.3, now);
        masterGain.connect(audioCtx.destination);

        // Play pleasant 3-tone chime sequence
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + index * 0.15);

          noteGain.gain.setValueAtTime(0, now + index * 0.15);
          noteGain.gain.linearRampToValueAtTime(1, now + index * 0.15 + 0.03);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.5);

          osc.connect(noteGain);
          noteGain.connect(masterGain);

          osc.start(now + index * 0.15);
          osc.stop(now + index * 0.15 + 0.5);
        });
      } catch (e) {
        // Audio fallback silent fail
      }
    }

    // --- Timer Functions ---
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      document.getElementById('timer-display').textContent = formatted;
      document.title = `${formatted} - ${modeThemes[currentMode].titleSuffix}`;
    }

    function toggleTimer() {
      playClickSound();
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      initAudio();
      isRunning = true;
      const startBtn = document.getElementById('start-btn');
      startBtn.textContent = 'TẠM DỪNG';
      startBtn.style.boxShadow = 'none';
      startBtn.style.transform = 'translateY(4px)';
      document.getElementById('skip-btn').classList.remove('hidden');

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          timerComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      const startBtn = document.getElementById('start-btn');
      startBtn.textContent = 'BẮT ĐẦU';
      startBtn.style.boxShadow = `0 6px 0 ${modeThemes[currentMode].shadowColor}`;
      startBtn.style.transform = 'translateY(0px)';
    }

    function skipTimer() {
      playClickSound();
      pauseTimer();
      if (currentMode === 'pomodoro') {
        switchMode('shortBreak');
      } else {
        switchMode('pomodoro');
      }
    }

    function timerComplete() {
      pauseTimer();
      playAlarmSound();

      // Update active task counter if finished pomodoro
      if (currentMode === 'pomodoro' && activeTaskId) {
        const task = tasks.find(t => t.id === activeTaskId);
        if (task) {
          task.act = (task.act || 0) + 1;
          saveTasksToStorage();
          renderTasks();
        }
      }

      // Auto-switch modes based on current mode
      if (currentMode === 'pomodoro') {
        switchMode('shortBreak');
        if (config.autoStartBreaks) startTimer();
      } else {
        switchMode('pomodoro');
        if (config.autoStartPomodoros) startTimer();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      pauseTimer();
      timeLeft = config[mode] * 60;

      // Update Body Background
      const body = document.getElementById('app-body');
      body.className = `${modeThemes[mode].bgClass} text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-white/20`;

      // Update Tabs Styling
      ['pomodoro', 'shortBreak', 'longBreak'].forEach(m => {
        const tab = document.getElementById(`tab-${m}`);
        if (m === mode) {
          tab.className = 'flex-1 py-1.5 px-3 rounded-lg transition-all duration-200 font-semibold bg-white/20 shadow-sm';
        } else {
          tab.className = 'flex-1 py-1.5 px-3 rounded-lg transition-all duration-200 opacity-80 hover:opacity-100';
        }
      });

      // Update Button Theme Colors
      const startBtn = document.getElementById('start-btn');
      startBtn.style.color = modeThemes[mode].btnTextHex;

      updateDisplay();
    }

    // --- Task Management Functions ---
    function renderTasks() {
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';

      tasks.forEach(task => {
        const isActive = task.id === activeTaskId;
        const taskCard = document.createElement('div');
        taskCard.className = `bg-white text-gray-800 rounded-xl p-4 flex items-center justify-between shadow-md transition-all border-l-8 ${
          isActive ? 'border-gray-800 ring-2 ring-white/50' : 'border-transparent hover:bg-gray-50'
        } ${task.completed ? 'opacity-60' : ''}`;

        taskCard.onclick = (e) => {
          // Avoid triggering when clicking buttons inside card
          if (e.target.closest('button')) return;
          setActiveTask(task.id);
        };

        taskCard.innerHTML = `
          <div class="flex items-center gap-3 cursor-pointer overflow-hidden">
            <button onclick="toggleTaskComplete('${task.id}')" class="text-xl text-gray-300 hover:text-green-500 transition">
              <i class="${task.completed ? 'fa-solid fa-circle-check text-green-500' : 'fa-regular fa-circle'}"></i>
            </button>
            <span class="font-semibold text-gray-800 truncate ${task.completed ? 'line-through text-gray-400' : ''}">
              ${escapeHtml(task.title)}
            </span>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md">
              ${task.act || 0} / ${task.est}
            </span>
            <button onclick="deleteTask('${task.id}')" class="text-gray-300 hover:text-red-500 transition p-1">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>
        `;

        listEl.appendChild(taskCard);
      });

      updateActiveTaskDisplay();
    }

    function setActiveTask(id) {
      playClickSound();
      activeTaskId = (activeTaskId === id) ? null : id;
      renderTasks();
    }

    function updateActiveTaskDisplay() {
      const display = document.getElementById('current-task-display');
      const activeTask = tasks.find(t => t.id === activeTaskId);
      if (activeTask) {
        display.textContent = `# Đang làm: ${activeTask.title}`;
      } else {
        display.textContent = 'Thời gian tập trung!';
      }
    }

    function toggleTaskComplete(id) {
      playClickSound();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasksToStorage();
        renderTasks();
      }
    }

    function deleteTask(id) {
      playClickSound();
      tasks = tasks.filter(t => t.id !== id);
      if (activeTaskId === id) activeTaskId = null;
      saveTasksToStorage();
      renderTasks();
    }

    function showTaskForm() {
      playClickSound();
      document.getElementById('add-task-btn').classList.add('hidden');
      document.getElementById('task-form').classList.remove('hidden');
      document.getElementById('task-title-input').focus();
    }

    function hideTaskForm() {
      document.getElementById('add-task-btn').classList.remove('hidden');
      document.getElementById('task-form').classList.add('hidden');
      document.getElementById('task-title-input').value = '';
      document.getElementById('task-est-input').value = 1;
    }

    function handleTaskSubmit(e) {
      e.preventDefault();
      playClickSound();

      const titleInput = document.getElementById('task-title-input');
      const estInput = document.getElementById('task-est-input');

      const newTask = {
        id: Date.now().toString(),
        title: titleInput.value.trim(),
        est: parseInt(estInput.value) || 1,
        act: 0,
        completed: false
      };

      tasks.push(newTask);
      if (!activeTaskId) activeTaskId = newTask.id;

      saveTasksToStorage();
      renderTasks();
      hideTaskForm();
    }

    function toggleTaskMenu() {
      const menu = document.getElementById('task-menu');
      menu.classList.toggle('hidden');
    }

    function clearCompletedTasks() {
      playClickSound();
      tasks = tasks.filter(t => !t.completed);
      if (activeTaskId && !tasks.find(t => t.id === activeTaskId)) {
        activeTaskId = null;
      }
      saveTasksToStorage();
      renderTasks();
      toggleTaskMenu();
    }

    function clearAllTasks() {
      playClickSound();
      tasks = [];
      activeTaskId = null;
      saveTasksToStorage();
      renderTasks();
      toggleTaskMenu();
    }

    // --- Modal & Settings Functions ---
    function openSettingsModal() {
      playClickSound();
      document.getElementById('setting-pomo').value = config.pomodoro;
      document.getElementById('setting-short').value = config.shortBreak;
      document.getElementById('setting-long').value = config.longBreak;
      document.getElementById('setting-autobreak').checked = config.autoStartBreaks;
      document.getElementById('setting-autopomo').checked = config.autoStartPomodoros;
      document.getElementById('setting-volume').value = config.volume;

      const modal = document.getElementById('settings-modal');
      const modalCard = document.getElementById('settings-modal-card');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
      }, 10);
    }

    function closeSettingsModal() {
      playClickSound();
      const modal = document.getElementById('settings-modal');
      const modalCard = document.getElementById('settings-modal-card');
      modal.classList.add('opacity-0');
      modalCard.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    function saveSettings() {
      config.pomodoro = parseInt(document.getElementById('setting-pomo').value) || 25;
      config.shortBreak = parseInt(document.getElementById('setting-short').value) || 5;
      config.longBreak = parseInt(document.getElementById('setting-long').value) || 15;
      config.autoStartBreaks = document.getElementById('setting-autobreak').checked;
      config.autoStartPomodoros = document.getElementById('setting-autopomo').checked;
      config.volume = parseInt(document.getElementById('setting-volume').value);

      localStorage.setItem('pomo_config', JSON.stringify(config));
      closeSettingsModal();

      // Reset timer with new values if not currently running
      if (!isRunning) {
        timeLeft = config[currentMode] * 60;
        updateDisplay();
      }
    }

    function resetApp() {
      if (confirm("Đặt lại bộ đếm giờ hiện tại?")) {
        switchMode('pomodoro');
      }
    }

    // --- LocalStorage & Utility Functions ---
    function saveTasksToStorage() {
      localStorage.setItem('pomo_tasks', JSON.stringify(tasks));
    }

    function loadLocalStorage() {
      const savedConfig = localStorage.getItem('pomo_config');
      if (savedConfig) {
        try { config = { ...config, ...JSON.parse(savedConfig) }; } catch (e) {}
      }

      const savedTasks = localStorage.getItem('pomo_tasks');
      if (savedTasks) {
        try { 
          tasks = JSON.parse(savedTasks);
          if (tasks.length > 0) activeTaskId = tasks[0].id;
        } catch (e) {}
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Close menus when clicking outside
    document.addEventListener('click', (e) => {
      const taskMenu = document.getElementById('task-menu');
      if (!e.target.closest('#task-menu') && !e.target.closest('button[onclick="toggleTaskMenu()"]')) {
        taskMenu.classList.add('hidden');
      }
    });

    // Initializer on Page Load
    window.onload = function () {
      loadLocalStorage();
      switchMode('pomodoro');
      renderTasks();
    };
  </script>
</body>
</html>
